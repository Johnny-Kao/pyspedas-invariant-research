name: PS02 exact staging validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Johnny-Kao/pyspedas
          ref: 381ee114de2f9f380c5142734351f91894305fdc
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -e .
      - name: Exact staging provenance and baseline RED
        env:
          PYTHONPATH: ${{ github.workspace }}
          MPLBACKEND: Agg
        run: |
          git rev-parse HEAD
          python -P -c 'import pathlib, pyspedas; p=pathlib.Path(pyspedas.__file__).resolve(); print(p); assert p.is_relative_to(pathlib.Path.cwd())'
          git restore --source=3e4cb176f6aeb1577fac288ca03199bcfc546c29 pyspedas/analysis/avg_data.py
          python -P - <<'PY'
          import unittest
          prefix='pyspedas.analysis.tests.test_analysis.TestAnalysisFunctions.'
          names=[prefix+'test_avg_data_width_trange',prefix+'test_avg_data_width_trange_dependencies']
          result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromNames(names))
          assert result.testsRun==2 and len(result.failures)==2 and not result.errors
          PY
      - name: Restore candidate and run avg_data tests including IDL
        env:
          PYTHONPATH: ${{ github.workspace }}
          MPLBACKEND: Agg
        run: |
          git restore --source=HEAD pyspedas/analysis/avg_data.py
          git diff --exit-code
          python -P -m unittest -v pyspedas.analysis.tests.test_analysis.TestAnalysisFunctions.test_avg_data pyspedas.analysis.tests.test_analysis.TestAnalysisFunctions.test_avg_data_width_trange pyspedas.analysis.tests.test_analysis.TestAnalysisFunctions.test_avg_data_width_trange_dependencies pyspedas.analysis.tests.test_analysis.TestAnalysisFunctions.test_avg_data_idl
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Johnny-Kao/pyspedas
          ref: 381ee114de2f9f380c5142734351f91894305fdc
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e . --group doc
      - run: python -m pip install -r docs/requirements.txt
      - name: Build and inspect rendered documentation
        run: |
          make -C docs html
          python - <<'PY'
          from pathlib import Path
          p=next(Path('docs').rglob('utilities.html'))
          s=p.read_text()
          assert 'only samples within that range are used' in s
          print('Verified rendered avg_data width documentation:', p)
          PY
