name: PS03 PS05 interpolation deep dive
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: spedas/pyspedas
          ref: 3e4cb176f6aeb1577fac288ca03199bcfc546c29
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ./upstream
      - name: Independent reference checks
        working-directory: upstream
        env:
          PYTHONPATH: ${{ github.workspace }}/upstream
        run: |
          git rev-parse HEAD
          python -P -c 'import pathlib, pyspedas; p=pathlib.Path(pyspedas.__file__).resolve(); print(p); assert p.is_relative_to(pathlib.Path.cwd())'
          python -P ../research_ps03_ps05.py
      - name: MMS actual coordinate rotation time alignment
        if: always()
        working-directory: upstream
        env:
          PYTHONPATH: ${{ github.workspace }}/upstream
        run: python -P ../research_ps05_mms_grid.py
      - name: Native regression and IDL reference
        if: always()
        working-directory: upstream
        env:
          PYTHONPATH: ${{ github.workspace }}/upstream
        run: python -P -m unittest -v pyspedas.utilities.tests.test_tinterpol_mxn pyspedas.utilities.tests.test_interpolate_rotation
