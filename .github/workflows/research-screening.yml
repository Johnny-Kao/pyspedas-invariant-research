name: PS04 particle ownership research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        case: [synthetic, erg, mms]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: spedas/pyspedas
          ref: 3e4cb176f6aeb1577fac288ca03199bcfc546c29
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e ./upstream
      - name: Run actual pinned upstream functions
        working-directory: upstream
        env:
          MPLBACKEND: Agg
          PYTHONPATH: ${{ github.workspace }}/upstream
        run: |
          set -o pipefail
          git rev-parse HEAD
          python -c 'import pyspedas; print(pyspedas.__file__)'
          python ../research_ps04.py ${{ matrix.case }} 2>&1 | tee ../ps04-${{ matrix.case }}.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ps04-${{ matrix.case }}
          path: ps04-${{ matrix.case }}.log
          if-no-files-found: warn
