name: PS01 staging documentation QC
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Johnny-Kao/pyspedas
          ref: dea45f814b49ee3d002aab45bdb4e08ca8449dab
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install documented dependencies
        run: |
          python -m pip install -e . --group doc
          python -m pip install -r docs/requirements.txt
      - name: Build candidate HTML and inspect coordinate API
        run: |
          set -o pipefail
          git rev-parse HEAD
          make -C docs html SPHINXOPTS="-w $RUNNER_TEMP/candidate-warnings.txt" 2>&1 | tee "$RUNNER_TEMP/candidate-build.log"
          test -f docs/build/html/coords.html
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Text(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
              def handle_data(self, data):
                  self.parts.append(data)
          page = Text()
          page.feed(Path("docs/build/html/coords.html").read_text())
          text = " ".join(" ".join(page.parts).split())
          assert "atan2(y, x) modulo 2*pi" in text, "Updated formula absent"
          assert "undefined when x and y are both zero" in text, "Pole convention absent"
          print("Rendered cart2spc formula and polar convention verified")
          PY
      - name: Compare baseline documentation warnings
        if: always()
        run: |
          set -o pipefail
          git restore --source=de567788cff954bbfb1456abc5142187c14fc2a5 -- pyspedas/cotrans_tools/cart2spc.py
          make -C docs html SPHINXOPTS="-E -w $RUNNER_TEMP/baseline-warnings.txt" 2>&1 | tee "$RUNNER_TEMP/baseline-build.log"
          python - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["RUNNER_TEMP"])
          def warning_set(name):
              return {line.split("WARNING:", 1)[1].strip() for line in (root / name).read_text().splitlines() if "WARNING:" in line}
          base = warning_set("baseline-warnings.txt")
          candidate = warning_set("candidate-warnings.txt")
          print("Baseline distinct warnings:", len(base))
          print("Candidate distinct warnings:", len(candidate))
          print("New warnings:", sorted(candidate - base))
          assert not candidate - base
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: staging-docs-evidence
          path: |
            ${{ runner.temp }}/*-warnings.txt
            ${{ runner.temp }}/*-build.log
          if-no-files-found: warn
